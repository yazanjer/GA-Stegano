env:
  name: local
  device: cpu
  reported: true
  threads: 1
  n_jobs: 1
  allow_mps: false
dataset:
  name: bossbase
  acquire: url
  probe_only: false
  root: /path/to/BOSSbase_1.01
  mirrors:
  - http://dde.binghamton.edu/download/ImageDB/BOSSbase_1.01.zip
  - http://agents.fel.cvut.cz/stegodata/BossBase-1.01-cover.tar.bz2
  kaggle:
    enabled: false
    slug: null
    kind: dataset
    cache_dir: null
    pin:
      version: null
      sha256: null
    license: BOSSBase is free for research use (cite Bas, Filler & Pevny, IH 2011).
      A Kaggle re-upload may carry additional terms; check the dataset page.
  pin:
    sha256: null
    n_files: null
  side: 512
  limit: 1000
  pattern: '*.pgm'
  source: BOSSBase 1.01, 10,000 never-compressed 512x512 grayscale images from 7 cameras
    (Bas, Filler & Pevny, IH 2011). Subsampled to `limit` covers; the subsample is
    deterministic given the seed and recorded per-image with a SHA-256 in the dataset
    manifest.
  license: Free for research use; cite Bas, Filler & Pevny, IH 2011.
  steganalysis_note: Standard corpus for SRM/CNN steganalysis. Not competition data,
    so there is no leaderboard split to confuse with a held-out test set -- the pipeline
    still carves its own cover-wise test split before any feature extraction.
  split:
    train: 0.5
    val: 0.25
    test: 0.25
    cover_wise: true
    n_folds: 1
ga:
  population: 25
  generations: 100
  tournament_size: 3
  crossover_prob: 0.8
  mutation_prob: 0.1
  elitism: 1
  patience: 25
  n_segments: 4
steganalysis:
  kind: classical
  features: srm_subset
  n_jobs: 1
  classifier:
    type: fld_ensemble
    d_sub: null
    n_learners: null
    max_learners: 200
    random_state: 0
  cross_validation:
    n_folds: 5
    stratified: true
tracking:
  enabled: true
  project: GA-Stegno
  entity: yazan-aljeroudi-rachis-systems
  group: null
  mode: online
  tags:
  - rebuttal
  - jst-6070-2025
  preflight: false
  git:
    enabled: false
    remote: null
    branch: main
    push: false
    commit_on_new_best: true
    commit_artifacts: true
    lfs: true
search:
  enabled: false
  objective: ga
  n_trials: 40
  timeout_s: null
  storage: sqlite:///optuna.db
  study_name: amdt_ga_search
  direction: maximize
  rate_bpp: 0.1
  val_fraction: 0.2
  pruner:
    n_startup_trials: 5
    n_warmup_steps: 3
supervisor:
  enabled: false
  metric: val/p_e
  lower_is_better: true
  trip:
    loss_median_multiple: 10.0
    min_delta: 0.001
    patience: 8
    gap_threshold: 0.25
    baseline_metric: 0.45
    warmup_epochs: 10
    max_rounds: 3
    min_epochs_between: 5
    poll_interval_s: 60
  wandb_run_path: null
  patch_branch: agent/patches
sync:
  enabled: true
  root: null
  subdir: amdt-runs
  interval_s: 60
  excludes:
  - '*.tmp'
  - '*.part'
  - '*.lock'
  - .git
  - .git/*
  - wandb
  - wandb/*
  - stego/*
  - data/*
  - '*.pgm'
  - '*.zip'
  - '*.tar.bz2'
  - .venv/*
  - __pycache__/*
  - '*.pyc'
  include_checkpoints: true
  max_file_mb: 512
  prune: true
  keep_last_n: 20
experiment:
  name: amdt_rebuttal
  seeds:
  - 0
  payload_rates_bpp:
  - 0.1
  - 0.4
  secret_key_hex: 2a7f4c9e1b6d80f3a5c2e7091d4b8fa63e5c1908d7b2a4f60c3e819d5a7b2f4c
  studies:
  - quality
  - steganalysis
  - stats
  verify_extraction: true
  stego_cache: disk
  max_cache_memory_mb: 1024
  max_cache_disk_mb: 20000
methods:
  proposed:
  - AMDT
  classical:
  - LSB
  - LSB-M
  - EA-LSB
  - GA-FT
  - PVD
  adaptive:
  - WOW
  - S-UNIWARD
  - HILL
  - MiPOD-lite
ablation:
  variants:
  - full
  - no_T1T2
  - no_T3
  - no_T4
  - no_decomp
  - fixed_path
  - fixed_plane
  - single_seg
  - no_ga
  - unconstrained
  rate_bpp: 0.1
stats:
  alpha: 0.05
  n_bootstrap: 10000
  correction: holm
output:
  root: outputs
  figures: figures
  tables: tables
  results: results
  formats:
  - pdf
  - svg
