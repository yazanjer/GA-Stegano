# Optuna hyper-parameter search. Validation only -- the objective functions
# assert that no test split was passed in.
enabled: false
objective: ga                # ga | cnn
n_trials: 40
timeout_s: null
# SQLite on persistent storage so an interrupted search resumes rather than
# restarting. On Colab: sqlite:////content/drive/MyDrive/amdt/optuna.db
storage: sqlite:///optuna.db
study_name: amdt_ga_search
direction: maximize          # maximize PSNR (ga) / minimize P_E (cnn)
rate_bpp: 0.1
# Fraction of covers used as the search-validation split. Disjoint from the
# test covers used for the reported tables.
val_fraction: 0.2
pruner:
  n_startup_trials: 5
  n_warmup_steps: 3
