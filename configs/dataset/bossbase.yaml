# BOSSBase 1.01: 10,000 never-compressed 512x512 8-bit grayscale PGM covers.
# Bas, Filler & Pevny, "Break Our Steganographic System", IH 2011.
#
# HOW TO GET IT -- read this before the overnight run.
#
# BOSSBase has outlived several download locations, and as of August 2026 none
# of the historical links could be verified automatically. Check which one is
# alive first (30 seconds, no download):
#
#     python -c "import sys; sys.path.insert(0,'src'); \
#       from amdt.data.fetch import probe_mirrors; \
#       import json,logging; logging.basicConfig(level='INFO'); \
#       print(json.dumps(probe_mirrors(open('mirrors.txt').read().split()),indent=2))"
#
# or simply: python run_experiments.py dataset=bossbase dataset.probe_only=true
#
# Then set `acquire` to whichever path works:
#   local   -> you already have it extracted somewhere (set `root`)
#   url     -> download from `mirrors` (no credentials needed)
#   kaggle  -> a Kaggle mirror (needs credentials; slug UNVERIFIED, see below)
name: bossbase
acquire: local              # local | url | kaggle  (how to obtain it)
probe_only: false           # true -> report mirror status and exit

# --- acquire: local ---------------------------------------------------------
root: /path/to/BOSSbase_1.01

# --- acquire: url -----------------------------------------------------------
# Tried in order; the first that responds wins and is recorded in the pin.
# These are the historically canonical locations. Verify before relying on them.
mirrors:
  - http://dde.binghamton.edu/download/ImageDB/BOSSbase_1.01.zip
  - http://agents.fel.cvut.cz/stegodata/BossBase-1.01-cover.tar.bz2

# --- acquire: kaggle --------------------------------------------------------
kaggle:
  enabled: false
  # UNVERIFIED: several user re-uploads of BOSSBase exist on Kaggle and they
  # are not all the same corpus (some are resized, some are JPEG-recompressed,
  # which would silently invalidate every spatial-domain result). Confirm the
  # slug and the file count on the dataset page, then pin the SHA-256 below.
  slug: null
  kind: dataset
  cache_dir: null
  pin:
    version: null
    sha256: null
  license: >-
    BOSSBase is free for research use (cite Bas, Filler & Pevny, IH 2011).
    A Kaggle re-upload may carry additional terms; check the dataset page.

# --- pin (fill in after the first successful download) ---------------------
# Copy these from the printed pin.json. Every later run verifies against them
# and warns loudly on drift without auto-upgrading.
pin:
  sha256: null
  n_files: null             # expect 10000 for the genuine BOSSbase 1.01

side: 512
# 2,000 covers is defensible for SRM+ensemble and runs overnight; the full
# 10,000 x 10 methods x 4 rates is ~100 h for the AMDT arm alone.
limit: 2000
pattern: "*.pgm"
source: >-
  BOSSBase 1.01, 10,000 never-compressed 512x512 grayscale images from 7
  cameras (Bas, Filler & Pevny, IH 2011). Subsampled to `limit` covers; the
  subsample is deterministic given the seed and recorded per-image with a
  SHA-256 in the dataset manifest.
license: "Free for research use; cite Bas, Filler & Pevny, IH 2011."
steganalysis_note: >-
  Standard corpus for SRM/CNN steganalysis. Not competition data, so there is
  no leaderboard split to confuse with a held-out test set -- the pipeline
  still carves its own cover-wise test split before any feature extraction.
split:
  train: 0.5
  val: 0.25
  test: 0.25
  cover_wise: true
  n_folds: 1
